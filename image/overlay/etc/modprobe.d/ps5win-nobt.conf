# The installer needs no Bluetooth. Without this, btusb retries the MT7961 firmware load every 0.4 s and resets
# the USB device, flooding the console (seen on the first Toshiba boot, 2026-11-21).
blacklist btusb
blacklist btmtk
blacklist bluetooth
install btusb /bin/false
install bluetooth /bin/false
